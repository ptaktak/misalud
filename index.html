<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiSalud</title>
</head>
<body style="font-family:sans-serif;margin:0;padding:20px;background:#f0f0f0;">

<div id="pantallaUsuario">
  <h2>Selecciona usuario</h2>
  <button id="botonLuis" style="display:block;width:100%;padding:20px;margin:10px 0;font-size:18px;background:#185FA5;color:white;border:none;border-radius:10px;">
    Luis
  </button>
  <button id="botonMujer" style="display:block;width:100%;padding:20px;margin:10px 0;font-size:18px;background:#3C3489;color:white;border:none;border-radius:10px;">
    Mi mujer
  </button>
</div>

<div id="pantallaApp" style="display:none;">
  <h2 id="saludo">Hola</h2>
  <p>App cargada correctamente.</p>
  <hr>

  <h3>Registrar glucosa</h3>
  <input type="number" id="glucosa" placeholder="mg/dL" style="width:100%;padding:10px;font-size:16px;margin-bottom:10px;">
  <button id="guardarGlucosa" style="width:100%;padding:15px;font-size:16px;background:#185FA5;color:white;border:none;border-radius:8px;">
    Guardar glucosa
  </button>

  <hr>
  <h3>Últimas mediciones</h3>
  <div id="listaRegistros">Sin registros aún.</div>

  <hr>
  <button id="botonVolver" style="width:100%;padding:15px;font-size:16px;background:#888;color:white;border:none;border-radius:8px;">
    Cambiar usuario
  </button>
</div>

<script>
var usuarioActual = null;
var registros = [];

try {
  var guardado = localStorage.getItem('misalud_simple');
  if (guardado) registros = JSON.parse(guardado);
} catch(e) {}

function guardarDatos() {
  try { localStorage.setItem('misalud_simple', JSON.stringify(registros)); } catch(e) {}
}

function mostrarRegistros() {
  var div = document.getElementById('listaRegistros');
  if (registros.length === 0) {
    div.innerHTML = 'Sin registros aún.';
    return;
  }
  var html = '';
  for (var i = registros.length - 1; i >= 0; i--) {
    var r = registros[i];
    var fecha = new Date(r.ts).toLocaleString('es-ES');
    html += '<div style="padding:8px;border-bottom:1px solid #ddd;">' + r.usuario + ' — ' + r.valor + ' mg/dL — ' + fecha + '</div>';
  }
  div.innerHTML = html;
}

function entrar(usuario) {
  usuarioActual = usuario;
  document.getElementById('saludo').textContent = 'Hola, ' + usuario;
  document.getElementById('pantallaUsuario').style.display = 'none';
  document.getElementById('pantallaApp').style.display = 'block';
  mostrarRegistros();
}

document.getElementById('botonLuis').addEventListener('click', function() {
  entrar('Luis');
});

document.getElementById('botonMujer').addEventListener('click', function() {
  entrar('Mi mujer');
});

document.getElementById('guardarGlucosa').addEventListener('click', function() {
  var val = parseFloat(document.getElementById('glucosa').value);
  if (!val || val < 20 || val > 600) {
    alert('Introduce un valor entre 20 y 600');
    return;
  }
  registros.push({ usuario: usuarioActual, valor: val, ts: Date.now() });
  guardarDatos();
  document.getElementById('glucosa').value = '';
  mostrarRegistros();
  alert('Guardado correctamente');
});

document.getElementById('botonVolver').addEventListener('click', function() {
  document.getElementById('pantallaApp').style.display = 'none';
  document.getElementById('pantallaUsuario').style.display = 'block';
});
</script>

</body>
</html>
