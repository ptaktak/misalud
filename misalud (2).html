<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiSalud</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; background: #f4f4f2; }
</style>
</head>
<body>

<div id="pUsuario" style="display:block; background:white; min-height:100vh; padding:40px 24px; text-align:center;">
  <div style="width:64px;height:64px;background:#E6F1FB;border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#185FA5" stroke-width="1.8"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
  </div>
  <div style="font-size:24px;font-weight:700;margin-bottom:8px;">MiSalud</div>
  <div style="font-size:15px;color:#666;margin-bottom:40px;">Selecciona tu perfil</div>

  <button id="btnU1"
    style="display:flex;align-items:center;gap:14px;width:100%;padding:18px 20px;background:white;border:1px solid #ddd;border-radius:12px;margin-bottom:12px;font-size:16px;cursor:pointer;text-align:left;">
    <div id="avU1" style="width:44px;height:44px;border-radius:50%;background:#E6F1FB;color:#185FA5;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0;">L</div>
    <div>
      <div id="nmU1" style="font-size:16px;font-weight:600;">Luis</div>
      <div id="subU1" style="font-size:12px;color:#999;margin-top:2px;">Toca para continuar</div>
    </div>
    <span style="margin-left:auto;font-size:24px;color:#999;">›</span>
  </button>

  <button id="btnU2"
    style="display:flex;align-items:center;gap:14px;width:100%;padding:18px 20px;background:white;border:1px solid #ddd;border-radius:12px;margin-bottom:12px;font-size:16px;cursor:pointer;text-align:left;">
    <div id="avU2" style="width:44px;height:44px;border-radius:50%;background:#EEEDFE;color:#3C3489;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0;">M</div>
    <div>
      <div id="nmU2" style="font-size:16px;font-weight:600;">Mi mujer</div>
      <div id="subU2" style="font-size:12px;color:#999;margin-top:2px;">Toca para continuar</div>
    </div>
    <span style="margin-left:auto;font-size:24px;color:#999;">›</span>
  </button>

  <button id="btnConf" style="background:none;border:none;color:#999;font-size:13px;cursor:pointer;padding:12px;margin-top:8px;">⚙️ Cambiar nombres</button>
</div>

<!-- MODAL NOMBRES -->
<div id="modalConf" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;align-items:flex-end;justify-content:center;">
  <div style="background:white;border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:430px;">
    <div style="font-size:16px;font-weight:600;margin-bottom:16px;">Cambiar nombres</div>
    <div style="margin-bottom:12px;">
      <label style="font-size:12px;font-weight:500;color:#666;display:block;margin-bottom:6px;">Usuario 1</label>
      <input id="inpNm1" type="text" maxlength="20" style="width:100%;height:44px;padding:0 12px;border:1px solid #ddd;border-radius:8px;font-size:15px;">
    </div>
    <div style="margin-bottom:16px;">
      <label style="font-size:12px;font-weight:500;color:#666;display:block;margin-bottom:6px;">Usuario 2</label>
      <input id="inpNm2" type="text" maxlength="20" style="width:100%;height:44px;padding:0 12px;border:1px solid #ddd;border-radius:8px;font-size:15px;">
    </div>
    <button id="btnGuardarConf" style="width:100%;height:46px;background:#185FA5;color:white;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;">Guardar</button>
    <button id="btnCerrarConf" style="width:100%;margin-top:10px;padding:12px;border:none;background:none;color:#666;font-size:14px;cursor:pointer;">Cancelar</button>
  </div>
</div>

<!-- APP PRINCIPAL -->
<div id="pApp" style="display:none; flex-direction:column; min-height:100vh;">

  <!-- TOPBAR -->
  <div style="background:white;border-bottom:1px solid #eee;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;">
    <div>
      <div style="font-size:16px;font-weight:600;">❤ MiSalud</div>
      <div id="tbFecha" style="font-size:12px;color:#999;"></div>
    </div>
    <button id="btnCambiarU" style="display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:20px;background:#f4f4f2;border:none;font-size:13px;font-weight:500;cursor:pointer;">
      <div id="tbAv" style="width:24px;height:24px;border-radius:50%;background:#E6F1FB;color:#185FA5;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;">L</div>
      <span id="tbNm">Luis</span>
    </button>
  </div>

  <!-- CONTENIDO -->
  <div id="contenido" style="flex:1;overflow-y:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch;"></div>

  <!-- NAV -->
  <div style="background:white;border-top:1px solid #eee;display:flex;position:sticky;bottom:0;">
    <button id="navIni" onclick="irTab('ini')" style="flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#185FA5;border:none;background:none;cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Inicio
    </button>
    <button id="navHis" onclick="irTab('his')" style="flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#999;border:none;background:none;cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Historial
    </button>
    <button id="navGrf" onclick="irTab('grf')" style="flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#999;border:none;background:none;cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Gráficas
    </button>
    <button id="navExp" onclick="irTab('exp')" style="flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#999;border:none;background:none;cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Exportar
    </button>
  </div>
</div>

<div id="toast" style="position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111;color:white;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:999;"></div>

<script>
var SK = 'ms5';
var MEM = null;
var CU = null;
var CT = 'ini';
var CF = 'tod';
var CM = 'Ayuno';

// STORAGE
function leer() {
  try {
    var r = localStorage.getItem(SK);
    if (r) { var p = JSON.parse(r); MEM = p; return p; }
  } catch(e) {}
  if (MEM) return MEM;
  MEM = { n: { u1: 'Luis', u2: 'Mi mujer' }, r: [] };
  return MEM;
}
function guardar(d) {
  MEM = d;
  try { localStorage.setItem(SK, JSON.stringify(d)); } catch(e) {}
}

// MOSTRAR/OCULTAR
function mostrar(id) { document.getElementById(id).style.display = 'flex'; }
function ocultar(id) { document.getElementById(id).style.display = 'none'; }

// INIT USUARIOS
function initUsuarios() {
  var d = leer();
  var n1 = d.n.u1 || 'Luis';
  var n2 = d.n.u2 || 'Mi mujer';
  document.getElementById('nmU1').textContent = n1;
  document.getElementById('nmU2').textContent = n2;
  document.getElementById('avU1').textContent = n1[0].toUpperCase();
  document.getElementById('avU2').textContent = n2[0].toUpperCase();
  var c1=0, c2=0;
  for (var i=0; i<d.r.length; i++) {
    if (d.r[i].u==='u1') c1++;
    if (d.r[i].u==='u2') c2++;
  }
  document.getElementById('subU1').textContent = c1>0 ? c1+' registros' : 'Toca para continuar';
  document.getElementById('subU2').textContent = c2>0 ? c2+' registros' : 'Toca para continuar';
}

function entrar(uid) {
  CU = uid;
  var d = leer();
  var nm = d.n[uid] || (uid==='u1'?'Luis':'Mi mujer');
  document.getElementById('tbNm').textContent = nm;
  document.getElementById('tbAv').textContent = nm[0].toUpperCase();
  document.getElementById('tbAv').style.background = uid==='u1' ? '#E6F1FB' : '#EEEDFE';
  document.getElementById('tbAv').style.color = uid==='u1' ? '#185FA5' : '#3C3489';
  var now = new Date();
  document.getElementById('tbFecha').textContent = now.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  ocultar('pUsuario');
  mostrar('pApp');
  irTab('ini');
}

function volverUsuarios() {
  ocultar('pApp');
  mostrar('pUsuario');
  initUsuarios();
}

// CONFIGURACION
function abrirConf() {
  var d = leer();
  document.getElementById('inpNm1').value = d.n.u1||'Luis';
  document.getElementById('inpNm2').value = d.n.u2||'Mi mujer';
  document.getElementById('modalConf').style.display = 'flex';
}
function cerrarConf() { document.getElementById('modalConf').style.display = 'none'; }
function guardarConf() {
  var d = leer();
  d.n.u1 = document.getElementById('inpNm1').value.trim()||'Luis';
  d.n.u2 = document.getElementById('inpNm2').value.trim()||'Mi mujer';
  guardar(d);
  cerrarConf();
  initUsuarios();
  toast('Nombres actualizados');
}

// TABS
function irTab(t) {
  CT = t;
  var tabs = ['ini','his','grf','exp'];
  for (var i=0; i<tabs.length; i++) {
    var btn = document.getElementById('nav'+tabs[i].charAt(0).toUpperCase()+tabs[i].slice(1));
    if (btn) btn.style.color = tabs[i]===t ? '#185FA5' : '#999';
  }
  var c = document.getElementById('contenido');
  if (t==='ini') tabInicio(c);
  else if (t==='his') tabHistorial(c);
  else if (t==='grf') tabGraficas(c);
  else if (t==='exp') tabExportar(c);
  c.scrollTop = 0;
}

// ── INICIO ────────────────────────────────────────────────────────────────
function tabInicio(el) {
  var d = leer();
  var gr=[], br=[];
  for (var i=0;i<d.r.length;i++) {
    if (d.r[i].u===CU && d.r[i].t==='g') gr.push(d.r[i]);
    if (d.r[i].u===CU && d.r[i].t==='b') br.push(d.r[i]);
  }
  var lg = gr.length ? gr[gr.length-1] : null;
  var lb = br.length ? br[br.length-1] : null;

  var moms = [['Ayuno','Ayuno'],['Antes comer','Antes'],['Despues comer','Despues'],['Noche','Noche']];
  var segs = '';
  for (var m=0;m<moms.length;m++) {
    var act = CM===moms[m][0];
    segs += '<button onclick="selMom(this)" data-m="'+moms[m][0]+'" style="flex:1;padding:7px 2px;border:none;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;'
      +(act?'background:white;color:#1a1a18;box-shadow:0 1px 3px rgba(0,0,0,.1);':'background:transparent;color:#666;')
      +'">'+moms[m][1]+'</button>';
  }

  el.innerHTML =
    // Stats
    '<div style="display:flex;gap:8px;padding:12px 12px 0;">'
    +'<div style="flex:1;background:white;border-radius:12px;padding:12px;border:1px solid #eee;text-align:center;">'
    +'<div style="font-size:11px;color:#999;margin-bottom:4px;">Glucosa</div>'
    +(lg ? '<div style="font-size:20px;font-weight:600;">'+lg.v+' <span style="font-size:11px;color:#999;">mg/dL</span></div><div style="font-size:11px;color:#999;">'+fRel(lg.ts)+'</div>'
         : '<div style="font-size:16px;color:#ccc;">—</div><div style="font-size:11px;color:#ccc;">Sin datos</div>')
    +'</div>'
    +'<div style="flex:1;background:white;border-radius:12px;padding:12px;border:1px solid #eee;text-align:center;">'
    +'<div style="font-size:11px;color:#999;margin-bottom:4px;">Tensión</div>'
    +(lb ? '<div style="font-size:20px;font-weight:600;">'+lb.s+'/'+lb.di+'</div><div style="font-size:11px;color:#999;">'+fRel(lb.ts)+'</div>'
         : '<div style="font-size:16px;color:#ccc;">—</div><div style="font-size:11px;color:#ccc;">Sin datos</div>')
    +'</div></div>'

    // Glucosa
    +'<div style="background:white;border-radius:12px;margin:12px 12px 0;border:1px solid #eee;">'
    +'<div style="padding:11px 14px 9px;border-bottom:1px solid #eee;font-size:11px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.06em;">Registrar glucosa</div>'
    +'<div style="padding:14px;">'
    +'<label style="font-size:12px;font-weight:500;color:#666;display:block;margin-bottom:6px;">Valor</label>'
    +'<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">'
    +'<input type="number" id="igv" inputmode="decimal" placeholder="ej. 98" style="flex:1;height:44px;padding:0 12px;border:1px solid #ddd;border-radius:8px;font-size:16px;background:#f4f4f2;">'
    +'<span style="font-size:12px;color:#999;width:44px;text-align:center;">mg/dL</span></div>'
    +'<label style="font-size:12px;font-weight:500;color:#666;display:block;margin-bottom:6px;">Momento</label>'
    +'<div style="display:flex;gap:4px;background:#f4f4f2;padding:3px;border-radius:8px;margin-bottom:12px;">'+segs+'</div>'
    +'<label style="font-size:12px;font-weight:500;color:#666;display:block;margin-bottom:6px;">Nota (opcional)</label>'
    +'<textarea id="ign" rows="2" placeholder="Ej: despues del desayuno..." style="width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;background:#f4f4f2;font-family:inherit;resize:none;"></textarea>'
    +'<button onclick="guardarG()" style="width:100%;height:46px;margin-top:12px;background:#185FA5;color:white;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;">Guardar glucosa</button>'
    +'</div></div>'

    // Tension
    +'<div style="background:white;border-radius:12px;margin:12px 12px 0;border:1px solid #eee;">'
    +'<div style="padding:11px 14px 9px;border-bottom:1px solid #eee;font-size:11px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.06em;">Registrar tensión <span style="font-size:10px;color:#ccc;font-weight:400;text-transform:none;">(opcional)</span></div>'
    +'<div style="padding:14px;">'
    +'<label style="font-size:12px;font-weight:500;color:#666;display:block;margin-bottom:6px;">Sistólica / Diastólica</label>'
    +'<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">'
    +'<input type="number" id="isv" inputmode="decimal" placeholder="125" style="flex:1;height:44px;padding:0 12px;border:1px solid #ddd;border-radius:8px;font-size:16px;background:#f4f4f2;min-width:0;">'
    +'<span style="font-size:18px;color:#ccc;">/</span>'
    +'<input type="number" id="idv" inputmode="decimal" placeholder="82" style="flex:1;height:44px;padding:0 12px;border:1px solid #ddd;border-radius:8px;font-size:16px;background:#f4f4f2;min-width:0;">'
    +'<span style="font-size:12px;color:#999;width:44px;text-align:center;">mmHg</span></div>'
    +'<label style="font-size:12px;font-weight:500;color:#666;display:block;margin-bottom:6px;">Nota (opcional)</label>'
    +'<textarea id="ibn" rows="2" placeholder="Ej: en reposo..." style="width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;background:#f4f4f2;font-family:inherit;resize:none;"></textarea>'
    +'<button onclick="guardarB()" style="width:100%;height:46px;margin-top:12px;background:#3C3489;color:white;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;">Guardar tensión</button>'
    +'</div></div>'
    +'<div style="height:12px;"></div>';
}

function selMom(btn) {
  var btns = document.querySelectorAll('[data-m]');
  for (var i=0;i<btns.length;i++) {
    btns[i].style.background = 'transparent';
    btns[i].style.color = '#666';
    btns[i].style.boxShadow = 'none';
  }
  btn.style.background = 'white';
  btn.style.color = '#1a1a18';
  btn.style.boxShadow = '0 1px 3px rgba(0,0,0,.1)';
  CM = btn.getAttribute('data-m');
}

function guardarG() {
  var v = parseFloat(document.getElementById('igv').value);
  if (!v||v<20||v>600) { toast('Valor entre 20 y 600'); return; }
  var n = document.getElementById('ign').value.trim();
  var d = leer();
  d.r.push({u:CU,t:'g',v:v,m:CM,n:n,ts:Date.now()});
  guardar(d);
  document.getElementById('igv').value='';
  document.getElementById('ign').value='';
  toast('Glucosa guardada ✓');
  irTab('ini');
}

function guardarB() {
  var s = parseFloat(document.getElementById('isv').value);
  var di = parseFloat(document.getElementById('idv').value);
  if (!s||!di) { toast('Introduce sistólica y diastólica'); return; }
  var n = document.getElementById('ibn').value.trim();
  var d = leer();
  d.r.push({u:CU,t:'b',s:s,di:di,n:n,ts:Date.now()});
  guardar(d);
  document.getElementById('isv').value='';
  document.getElementById('idv').value='';
  document.getElementById('ibn').value='';
  toast('Tensión guardada ✓');
  irTab('ini');
}

// ── HISTORIAL ─────────────────────────────────────────────────────────────
function tabHistorial(el) {
  var d = leer();
  var recs=[];
  for (var i=d.r.length-1;i>=0;i--) {
    var r=d.r[i];
    if (r.u!==CU) continue;
    if (CF==='glu'&&r.t!=='g') continue;
    if (CF==='ten'&&r.t!=='b') continue;
    recs.push({r:r,i:i});
  }
  var items='';
  for (var k=0;k<recs.length;k++) {
    var r=recs[k].r, ri=recs[k].i;
    if (r.t==='g') {
      var col = r.v<70?'#854F0B':r.v>130?'#A32D2D':'#3B6D11';
      var bg  = r.v<70?'#FAEEDA':r.v>130?'#FCEBEB':'#EAF3DE';
      var bt  = r.v<70?'Baja':r.v>130?'Alta':'Normal';
      items+='<div style="display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid #eee;gap:10px;">'
        +'<div style="min-width:42px;text-align:center;"><div style="font-size:11px;font-weight:600;color:#666;">'+fDay(r.ts)+'</div><div style="font-size:10px;color:#999;">'+fTime(r.ts)+'</div></div>'
        +'<div style="flex:1;min-width:0;">'
        +'<span style="font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:'+bg+';color:'+col+';">'+bt+'</span>'
        +'<div style="font-size:11px;color:#666;margin-top:3px;">'+r.m+(r.n?' · <em style="color:#999">'+r.n+'</em>':'')+'</div></div>'
        +'<div style="text-align:right;"><div style="font-size:15px;font-weight:600;">'+r.v+'</div><div style="font-size:11px;color:#999;">mg/dL</div></div>'
        +'<button onclick="borrar('+ri+')" style="background:none;border:none;cursor:pointer;color:#ccc;padding:4px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg></button>'
        +'</div>';
    } else {
      var col2=r.s<90?'#854F0B':r.s>140?'#A32D2D':'#3B6D11';
      var bg2 =r.s<90?'#FAEEDA':r.s>140?'#FCEBEB':'#EAF3DE';
      var bt2 =r.s<90?'Baja':r.s>140?'Alta':'Normal';
      items+='<div style="display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid #eee;gap:10px;">'
        +'<div style="min-width:42px;text-align:center;"><div style="font-size:11px;font-weight:600;color:#666;">'+fDay(r.ts)+'</div><div style="font-size:10px;color:#999;">'+fTime(r.ts)+'</div></div>'
        +'<div style="flex:1;min-width:0;">'
        +'<span style="font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:#EEEDFE;color:#3C3489;">Tensión</span> '
        +'<span style="font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;background:'+bg2+';color:'+col2+';">'+bt2+'</span>'
        +(r.n?'<div style="font-size:11px;color:#999;margin-top:2px;"><em>'+r.n+'</em></div>':'')+'</div>'
        +'<div style="text-align:right;"><div style="font-size:15px;font-weight:600;">'+r.s+'/'+r.di+'</div><div style="font-size:11px;color:#999;">mmHg</div></div>'

function chart(cid,labels,sets,ref) {
  var cv=document.getElementById(cid); if(!cv) return;
  var cx=cv.getContext('2d');
  var W=cv.parentElement.clientWidth, H=180;
  cv.width=W; cv.height=H;
  var P={t:14,r:14,b:30,l:38};
  var CW=W-P.l-P.r, CH=H-P.t-P.b;
  var av=[];
  for(var i=0;i<sets.length;i++) for(var j=0;j<sets[i].d.length;j++) av.push(sets[i].d[j]);
  var mn=Math.min.apply(null,av.concat([ref[0]]))-10;
  var mx=Math.max.apply(null,av.concat([ref[1]]))+10;
  var n=labels.length;
  function sx(i){return P.l+i*(CW/(n-1));}
  function sy(v){return P.t+CH-(v-mn)/(mx-mn)*CH;}
  cx.clearRect(0,0,W,H);
  for(var s=0;s<=4;s++){
    var t=s/4,y=P.t+CH*t;
    cx.strokeStyle='rgba(0,0,0,.07)'; cx.lineWidth=.5;
    cx.beginPath(); cx.moveTo(P.l,y); cx.lineTo(P.l+CW,y); cx.stroke();
    cx.fillStyle='#999'; cx.font='10px sans-serif'; cx.textAlign='right';
    cx.fillText(Math.round(mx-t*(mx-mn)),P.l-4,y+3);
  }
  cx.fillStyle='rgba(59,109,17,.1)';
  cx.fillRect(P.l,sy(ref[1]),CW,sy(ref[0])-sy(ref[1]));
  for(var di=0;di<sets.length;di++){
    var ds=sets[di];
    cx.strokeStyle=ds.c; cx.lineWidth=2; cx.lineJoin='round';
    cx.beginPath();
    for(var pi=0;pi<ds.d.length;pi++){pi?cx.lineTo(sx(pi),sy(ds.d[pi])):cx.moveTo(sx(pi),sy(ds.d[pi]));}
    cx.stroke();
    for(var dot=0;dot<ds.d.length;dot++){
      cx.fillStyle=ds.c; cx.beginPath(); cx.arc(sx(dot),sy(ds.d[dot]),3.5,0,Math.PI*2); cx.fill();
      cx.fillStyle='white'; cx.beginPath(); cx.arc(sx(dot),sy(ds.d[dot]),1.5,0,Math.PI*2); cx.fill();
    }
  }
  cx.fillStyle='#999'; cx.font='10px sans-serif'; cx.textAlign='center';
  for(var li=0;li<labels.length;li++) cx.fillText(labels[li],sx(li),H-8);
}

function exportar(scope) {
  var d=leer(), recs=[];
  for(var i=0;i<d.r.length;i++) {
    if(scope==='mio'&&d.r[i].u!==CU) continue;
    recs.push(d.r[i]);
  }
  if(!recs.length){toast('No hay registros');return;}
  var rows=[['Usuario','Tipo','Fecha','Hora','Glucosa(mg/dL)','Sistolica','Diastolica','Momento','Nota']];
  for(var j=0;j<recs.length;j++){
    var r=recs[j], dt=new Date(r.ts);
    var f=dt.toLocaleDateString('es-ES');
    var h=dt.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
    var nm=d.n[r.u]||r.u;
    if(r.t==='g') rows.push([nm,'Glucosa',f,h,r.v,'','',r.m||'',r.n||'']);
    else rows.push([nm,'Tension',f,h,'',r.s,r.di,'',r.n||'']);
  }
  var csv='';
  for(var ri=0;ri<rows.length;ri++){
    var cells=[];
    for(var ci=0;ci<rows[ri].length;ci++) cells.push('"'+String(rows[ri][ci]).replace(/"/g,'""')+'"');
    csv+=cells.join(',')+'
';
  }
  var blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download='misalud_'+new Date().toISOString().split('T')[0]+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('CSV descargado ✓');
}

function borrarMio() {
  if(!confirm('¿Borrar todos tus registros?')) return;
  var d=leer(), kept=[];
  for(var i=0;i<d.r.length;i++) if(d.r[i].u!==CU) kept.push(d.r[i]);
  d.r=kept; guardar(d);
  toast('Registros borrados'); irTab('exp');
}

// ── HELPERS ───────────────────────────────────────────────────────────────
function fDay(ts){
  var now=new Date(),dt=new Date(ts);
  var diff=Math.floor((now-dt)/86400000);
  if(diff===0) return 'Hoy';
  if(diff===1) return 'Ayer';
  return dt.toLocaleDateString('es-ES',{day:'numeric',month:'short'});
}
function fTime(ts){return new Date(ts).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});}
function fRel(ts){var d=fDay(ts),t=fTime(ts);return d==='Hoy'?'Hoy '+t:d+' '+t;}

function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.style.opacity='1';
  setTimeout(function(){t.style.opacity='0';},2200);
}
